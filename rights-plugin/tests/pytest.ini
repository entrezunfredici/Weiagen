[pytest]
# This file MUST live in tests/ (not one level up in rights-plugin/), and
# that placement is load-bearing, not cosmetic — same reasoning as
# odoo-plugin/tests/pytest.ini (copied verbatim below; see that file's
# history in .agents/DECISIONS.md, 2026-08-06, for the debugging story).
#
# rights-plugin/__init__.py is a real package (the Hermes plugin entry
# point), but its directory name has a hyphen — not a valid Python
# identifier — so it can never be `import`ed the normal way. pytest's
# collection walks every ancestor directory between its rootdir and a
# collected test file, and wraps any of them that contain an __init__.py in
# a `Package` collector — which imports that __init__.py to build the
# package tree. If rootdir (or any directory pytest walks through) is
# rights-plugin/ itself, pytest tries to import rights-plugin/__init__.py as
# that ancestor package, which fails on its relative imports because
# pytest's ad-hoc import isn't the real Hermes plugin-loading context.
#
# Neither `--import-mode=importlib` nor `consider_namespace_packages=false`
# prevents this. What actually fixes it: pytest never walks *above* rootdir
# when building the Package tree, so keeping this ini file (and therefore
# rootdir) inside tests/ itself means rights-plugin/ is never examined at
# all. Kept `--import-mode=importlib` anyway as the more robust
# general-purpose mode. See tests/conftest.py for how rights_plugin/
# __init__.py itself gets loaded deliberately (mirroring Hermes's real
# plugin loader) for the tests that actually need it.
addopts = --import-mode=importlib
