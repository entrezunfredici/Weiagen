[pytest]
# MUST live in tests/, not in docs-plugin/ — same load-bearing placement as
# rights-plugin/tests/pytest.ini (see that file and .agents/DECISIONS.md,
# 2026-08-06): docs-plugin/__init__.py sits in a hyphenated directory and
# uses relative imports, so pytest must never treat docs-plugin/ as an
# ancestor package. tests/conftest.py loads the plugin deliberately instead.
addopts = --import-mode=importlib
